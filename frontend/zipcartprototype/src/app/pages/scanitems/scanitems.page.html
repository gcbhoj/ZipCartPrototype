<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Scan Barcode</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container">
    <app-barcodescanner [disabled]="productDisplayed"></app-barcodescanner>
    <ion-button (click)="sendBarCode()">sendBarcode Test Only</ion-button>
    <app-scanned-product-display
      *ngIf="productDisplayed"
    ></app-scanned-product-display>
  </div>
</ion-content>

<ion-footer *ngIf="productDisplayed">
  <ion-toolbar>
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-button
            expand="block"
            color="primary"
            [disabled]="!productDisplayed || !addItemsToCartButtonEnabled"
            (click)="addScannedItemToCart()"
          >
            Add Item to Cart
          </ion-button>
        </ion-col>

        <ion-col size="6">
          <ion-button
            expand="block"
            color="medium"
            (click)="removeScannedItem()"
          >
            Cancel
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
