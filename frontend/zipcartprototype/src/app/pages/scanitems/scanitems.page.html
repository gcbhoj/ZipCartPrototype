<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goToHomePage()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Scan Barcode</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container">
    <app-barcodescanner [disabled]="productDisplayed"></app-barcodescanner>
    <ion-button (click)="sendBarCode()">sendBarcode Test Only</ion-button>
    <app-scanned-product-display></app-scanned-product-display>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-button expand="block" color="primary">
            Add Item to Cart
          </ion-button>
        </ion-col>

        <ion-col size="6">
          <ion-button
            expand="block"
            color="medium"
            (click)="removeScannedItem()"
          >
            Cancel
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
