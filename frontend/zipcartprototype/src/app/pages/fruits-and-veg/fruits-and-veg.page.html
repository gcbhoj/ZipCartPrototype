<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>fruitsAndVeg</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">fruitsAndVeg</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="camera_border"><app-camera></app-camera></div>
  <div style="width: 50px; height: 50px">
    <!-- ✅ Correct image display -->
    <img *ngIf="imageURL" [src]="imageURL" />
  </div>
  <div class="button-container">
    <ion-button (click)="sendImageButton()">Send Image</ion-button>
  </div>

  <app-weighed-product-display></app-weighed-product-display>
  <app-python-response></app-python-response>
</ion-content>
